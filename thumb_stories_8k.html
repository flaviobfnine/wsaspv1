<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Thumbnail Stories 8K</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: #041926;
    font-family: 'Montserrat', sans-serif;
    position: relative;
    overflow: hidden;
  }
  
  .bg-img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;
    filter: contrast(1.18) brightness(0.85) saturate(1.1);
  }
  
  .gradient-overlay {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 75% 20%, rgba(0,210,255,0.25) 0%, transparent 60%),
      linear-gradient(180deg, rgba(4,25,38,0.7) 0%, rgba(4,25,38,0.2) 30%, rgba(4,25,38,0.92) 70%, #041926 100%);
  }

  .top-bar {
    position: absolute;
    top: 90px;
    left: 60px;
    right: 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .logo {
    height: 85px;
    filter: drop-shadow(0 4px 14px rgba(0,0,0,0.8));
  }

  .tag-live {
    background: rgba(0, 210, 255, 0.15);
    border: 2px solid #00D2FF;
    color: #00D2FF;
    padding: 14px 28px;
    border-radius: 50px;
    font-size: 22px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
  }

  /* Floating Notification Card */
  .pix-card {
    position: absolute;
    top: 620px;
    left: 60px;
    right: 60px;
    background: rgba(4, 25, 38, 0.9);
    border: 3px solid #00E676;
    backdrop-filter: blur(20px);
    border-radius: 28px;
    padding: 30px 36px;
    display: flex;
    align-items: center;
    gap: 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 40px rgba(0, 230, 118, 0.4);
    z-index: 10;
  }

  .pix-icon {
    width: 76px;
    height: 76px;
    background: #00E676;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 900;
    color: #041926;
    box-shadow: 0 0 25px rgba(0, 230, 118, 0.7);
  }

  .pix-info {
    display: flex;
    flex-direction: column;
  }

  .pix-title {
    color: #94A3B8;
    font-size: 20px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .pix-value {
    color: #00E676;
    font-size: 48px;
    font-weight: 900;
    letter-spacing: -0.5px;
    text-shadow: 0 0 18px rgba(0,230,118,0.5);
  }

  /* Content Bottom */
  .content-bottom {
    position: absolute;
    bottom: 120px;
    left: 60px;
    right: 60px;
    z-index: 10;
  }

  .badge-case {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #00D2FF;
    color: #041926;
    padding: 14px 30px;
    border-radius: 14px;
    font-size: 26px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 28px;
    box-shadow: 0 10px 30px rgba(0, 210, 255, 0.4);
  }

  .main-title {
    font-size: 82px;
    font-weight: 900;
    line-height: 1.05;
    color: #FFFFFF;
    text-transform: uppercase;
    text-shadow: 0 4px 25px rgba(0,0,0,0.9);
  }

  .highlight-yellow {
    color: #FFE500;
    font-size: 118px;
    display: block;
    margin: 8px 0;
    text-shadow: 0 4px 35px rgba(255, 229, 0, 0.6), 0 0 20px rgba(0,0,0,0.9);
    letter-spacing: -1px;
  }

  .sub-title {
    font-size: 40px;
    color: #F8FAFC;
    font-weight: 800;
    background: rgba(255,255,255,0.08);
    padding: 14px 26px;
    border-radius: 14px;
    display: inline-block;
    border-left: 8px solid #FFE500;
    backdrop-filter: blur(10px);
    margin-top: 14px;
    line-height: 1.2;
  }
</style>
</head>
<body>
  <img class="bg-img" src="file:///d:/BACKUP_ARQUIVOS/SITES/ASIMOV/SITES/SITE%202/assets/aluno_faturou_8k.jpg" />
  <div class="gradient-overlay"></div>

  <div class="top-bar">
    <img class="logo" src="file:///d:/BACKUP_ARQUIVOS/SITES/ASIMOV/SITES/SITE%202/assets/logo_wme_workshop.webp" />
    <div class="tag-live">💰 CASE REAL</div>
  </div>

  <div class="pix-card">
    <div class="pix-icon">✓</div>
    <div class="pix-info">
      <div class="pix-title">PIX RECEBIDO • UNIFORMES</div>
      <div class="pix-value">+ R$ 8.000,00</div>
    </div>
  </div>

  <div class="content-bottom">
    <div class="badge-case">🚀 RESULTADO DE ALUNO WME</div>
    <h1 class="main-title">
      ELE FATUROU
      <span class="highlight-yellow">R$ 8 MIL</span>
    </h1>
    <div class="sub-title">NO PRIMEIRO PEDIDO DE UNIFORMES ESPORTIVOS</div>
  </div>
</body>
</html>
