<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Thumbnail Feed 8K</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1080px;
    background: #041926;
    font-family: 'Montserrat', sans-serif;
    position: relative;
    overflow: hidden;
  }
  
  .bg-img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    filter: contrast(1.15) brightness(0.88) saturate(1.1);
  }
  
  .gradient-overlay {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 75% 25%, rgba(0,210,255,0.2) 0%, transparent 55%),
      linear-gradient(180deg, rgba(4,25,38,0.5) 0%, rgba(4,25,38,0.15) 35%, rgba(4,25,38,0.92) 75%, #041926 100%);
  }

  .top-bar {
    position: absolute;
    top: 45px;
    left: 45px;
    right: 45px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .logo {
    height: 70px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
  }

  .tag-live {
    background: rgba(0, 210, 255, 0.15);
    border: 2px solid #00D2FF;
    color: #00D2FF;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: 19px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
  }

  /* Floating Notification Card */
  .pix-card {
    position: absolute;
    top: 340px;
    right: 45px;
    background: rgba(4, 25, 38, 0.88);
    border: 2px solid #00E676;
    backdrop-filter: blur(16px);
    border-radius: 22px;
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(0, 230, 118, 0.35);
    z-index: 10;
    transform: rotate(2deg);
  }

  .pix-icon {
    width: 60px;
    height: 60px;
    background: #00E676;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 900;
    color: #041926;
    box-shadow: 0 0 20px rgba(0, 230, 118, 0.6);
  }

  .pix-info {
    display: flex;
    flex-direction: column;
  }

  .pix-title {
    color: #94A3B8;
    font-size: 16px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .pix-value {
    color: #00E676;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -0.5px;
    text-shadow: 0 0 15px rgba(0,230,118,0.4);
  }

  /* Content Bottom */
  .content-bottom {
    position: absolute;
    bottom: 55px;
    left: 45px;
    right: 45px;
    z-index: 10;
  }

  .badge-case {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #00D2FF;
    color: #041926;
    padding: 10px 24px;
    border-radius: 10px;
    font-size: 21px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0, 210, 255, 0.4);
  }

  .main-title {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.05;
    color: #FFFFFF;
    text-transform: uppercase;
    text-shadow: 0 4px 20px rgba(0,0,0,0.9);
  }

  .highlight-yellow {
    color: #FFE500;
    font-size: 92px;
    display: block;
    margin: 4px 0;
    text-shadow: 0 4px 30px rgba(255, 229, 0, 0.6), 0 0 15px rgba(0,0,0,0.9);
    letter-spacing: -1px;
  }

  .sub-title {
    font-size: 32px;
    color: #F8FAFC;
    font-weight: 800;
    background: rgba(255,255,255,0.08);
    padding: 10px 20px;
    border-radius: 10px;
    display: inline-block;
    border-left: 6px solid #FFE500;
    backdrop-filter: blur(8px);
    margin-top: 8px;
  }
</style>
</head>
<body>
  <img class="bg-img" src="file:///d:/BACKUP_ARQUIVOS/SITES/ASIMOV/SITES/SITE%202/assets/aluno_faturou_8k.jpg" />
  <div class="gradient-overlay"></div>

  <div class="top-bar">
    <img class="logo" src="file:///d:/BACKUP_ARQUIVOS/SITES/ASIMOV/SITES/SITE%202/assets/logo_wme_workshop.webp" />
    <div class="tag-live">💰 CASE DE SUCESSO</div>
  </div>

  <div class="pix-card">
    <div class="pix-icon">✓</div>
    <div class="pix-info">
      <div class="pix-title">PIX RECEBIDO • UNIFORMES</div>
      <div class="pix-value">+ R$ 8.000,00</div>
    </div>
  </div>

  <div class="content-bottom">
    <div class="badge-case">🚀 RESULTADO REAL DE ALUNO</div>
    <h1 class="main-title">
      ELE FATUROU
      <span class="highlight-yellow">R$ 8 MIL</span>
    </h1>
    <div class="sub-title">NO PRIMEIRO PEDIDO DE UNIFORMES</div>
  </div>
</body>
</html>
